# Render Blueprint: backend API + Redis (Key Value), both on the free plan.
# The database is on Neon (free Render Postgres is deleted after 30 days),
# and the frontend is on Vercel. See README > Deploying.
#
# Values marked `sync: false` are secrets: Render asks for them when you
# create the Blueprint. They are never stored in this file.

services:
  - type: web
    name: securepay-api
    runtime: python
    plan: free
    region: singapore          # keep the same region as the Neon database
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 1. scripts/init_db.py applies any new database migrations (a no-op
    #    when there are none). It runs before the server starts, and the free
    #    plan has a single instance, so two copies never migrate at once.
    # 2. --proxy-headers: read the visitor's IP from Render's proxy headers
    #    instead of seeing every request as coming from the proxy itself.
    startCommand: python scripts/init_db.py && uvicorn src.api.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*' --no-access-log
    # Checks Postgres and Redis, so Render only sends traffic to an
    # instance that can actually serve it.
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL          # Neon connection string (direct, not -pooler)
        sync: false
      - key: ENCRYPTION_KEY        # Fernet key, see README
        sync: false
      - key: CORS_ORIGINS          # your Vercel URL, e.g. https://securepay.vercel.app
        sync: false
      - key: JWT_SECRET_KEY        # random, generated by Render
        generateValue: true
      - key: ENABLE_ADMIN_ROUTES   # bank simulator routes are not exposed online
        value: "false"
      - key: LOG_FORMAT            # one JSON object per log line
        value: json
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: securepay-redis
          property: connectionString

  - type: keyvalue
    name: securepay-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []              # only reachable from your own Render services
